name: CI

# Runs on every push and PR against main/master — catches breakage
# before it reaches the "fully working" state your personal laptop is
# already at (PR-AUC 0.987 etc.) so a bad commit can't silently regress it.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]  # matches your local venv — requirements.txt
        # was pip-freeze'd against it, so older Pythons can't resolve every pin

    steps:
      # Step 1 — pull the repo
      - uses: actions/checkout@v4

      # Step 2 — set up Python, with pip caching so repeat runs don't
      # re-download every dependency from scratch
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Step 3 — install production deps (requirements.txt) and
      # test-only deps (requirements-dev.txt) separately, so pytest/ruff
      # never end up bundled into anything you'd actually deploy
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Step 4 — lint first, fail fast before burning time on the
      # (slower) test suite if there's a basic style/import error
      - name: Lint with ruff
        run: ruff check .

      # Step 5 — run tests. GROQ_API_KEY is stubbed so importing
      # agents/attrition_agent.py doesn't crash in CI just because the
      # real key isn't present — add a GROQ_API_KEY repo secret later
      # if you want CI to exercise real Groq calls (not recommended for
      # routine CI runs — keep that for local/manual testing).
      - name: Run tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'ci-placeholder-key' }}
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml -v

      # Step 6 — keep the coverage report as a downloadable artifact so
      # you can see exactly which lines aren't covered yet
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml